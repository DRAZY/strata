version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # egui, eframe and egui-wgpu move together.
      egui:
        patterns: ["egui*", "eframe"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
