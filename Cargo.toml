[package]
name = "strata"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
egui = "0.36.2"
ignore = "0.4.33"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ropey = { version = "1.6.1", default-features = false, features = ["simd", "cr_lines"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
encoding_rs = "0.8.42"
