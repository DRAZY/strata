[package]
name = "strata"
version = "1.0.2"
edition = "2024"
license = "MIT"
description = "A fast, open-source code and text editor, written in Rust"
repository = "https://github.com/DRAZY/strata"
readme = "README.md"
keywords = ["editor", "text-editor", "code-editor", "egui"]
categories = ["text-editors"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11", "links"] }
egui = "0.36.2"
ignore = "0.4.33"
regex = "1.13.1"
globset = "0.4.20"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd", "cr_lines"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
encoding_rs = "0.8.42"
arboard = { version = "3", default-features = false }
alacritty_terminal = { version = "0.26.0", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
log = "0.4.34"
spellbook = "0.4.2"
# Compresses printed PDFs (already built for syntect and png).
flate2 = "1.1.10"
# Guessing the encoding of files that aren't Unicode (Shift_JIS, GBK, KOI8…).
chardetng = "1.0.0"
# Image previews (already in the build for eframe and arboard; these formats added).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# Updates: checking the ed25519 signature and SHA-256 of a downloaded update
# (pure Rust; the download itself goes through the system's curl, see src/update).
ed25519-dalek = { version = "3.0.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

# Dev aids read from STRATA_* environment variables (see src/dev.rs).
# `devtools` (default): screenshots and first-frame panels; build release
# packages with --no-default-features to leave them out. `dev-hooks`: the
# aids that run or change things, which otherwise work only in debug builds.
[features]
default = ["devtools"]
devtools = []
dev-hooks = []

# build.rs precompiles bat's extra syntaxes (via two-face) plus assets/syntaxes.
[build-dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["yaml-load", "dump-create", "dump-load", "parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# Windows builds: the icon and version details in Strata.exe (build.rs; any host,
# so the mingw cross-build from macOS gets them too).
winresource = { version = "0.1.34", default-features = false }

# Checking who's on the other end of the single-instance socket (getpeereid / SO_PEERCRED).
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
# Finder / Dock "open documents" Apple Events (same versions muda and eframe use).
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAppleEventDescriptor", "NSAppleEventManager", "NSError", "NSFileManager", "NSNotification", "NSOperation", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
# Side bar Delete (the Recycle Bin), putting restored windows on a monitor,
# Review Changes' file identity and no-replace moves (src/claim.rs), and job
# objects that end a language server together with the processes it starts
# (the version already in the build, through winit).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_Security"] }
